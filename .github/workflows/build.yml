name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assemblePerformance --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rekakko-apk
          path: app/build/outputs/apk/performance/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/performance/*.apk
          generate_release_notes: true
